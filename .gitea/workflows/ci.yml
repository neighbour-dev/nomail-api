name: CI and Docker release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace --all-targets
      - run: cargo test --locked -p nomail-core --features openapi --lib
      - run: cargo clippy --locked -p nomail-core --features openapi --all-targets -- -D warnings
      - run: cargo test --locked -p nomail-core --doc
      - run: cargo check --locked -p nomail-core --target wasm32-unknown-unknown
      - run: cargo build --locked --release -p nomail-server --bins

  integration:
    name: Workers D1 and Durable Objects integration tests
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          targets: wasm32-unknown-unknown
      - name: Install official Workers build tool
        run: cargo install worker-build --locked --version 0.8.7
      - name: Run Workers local integration tests
        working-directory: crates/nomail-workers
        run: |
          npm ci
          npm test

  docker:
    name: Build and push Docker image
    needs: [test, integration]
    if: ${{ gitea.event_name == 'workflow_dispatch' || (gitea.event_name == 'push' && (gitea.ref == 'refs/heads/main' || startsWith(gitea.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve GHCR image name
        id: image
        shell: bash
        env:
          GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE || secrets.GHCR_USERNAME }}
        run: |
          namespace="${GHCR_NAMESPACE,,}"
          if [[ ! "$namespace" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Set GHCR_USERNAME secret or GHCR_NAMESPACE variable to a GitHub account or organization name."
            exit 1
          fi
          echo "name=ghcr.io/${namespace}/nomail-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ gitea.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max
          provenance: mode=min
