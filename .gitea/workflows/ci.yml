name: CI and Docker release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --bins

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    # Explicit container execution gives the job and its services a shared Docker network.
    # Node is needed by actions/checkout; the Rust toolchain is installed below.
    container:
      image: node:22-bookworm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nomail-test-only
          POSTGRES_DB: nomail_test
        options: >-
          --health-cmd "pg_isready -U postgres -d nomail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:nomail-test-only@postgres:5432/nomail_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends postgresql-client
      - name: Verify test database connection
        env:
          PGPASSWORD: nomail-test-only
          PGCONNECT_TIMEOUT: '5'
        run: psql --host=postgres --username=postgres --dbname=nomail_test --no-password --set=ON_ERROR_STOP=1 --command='SELECT 1'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - name: Run PostgreSQL integration tests
        run: cargo test --locked --test api -- --ignored

  docker:
    name: Build and push Docker image
    needs: [test, integration]
    if: ${{ gitea.event_name == 'workflow_dispatch' || (gitea.event_name == 'push' && (gitea.ref == 'refs/heads/main' || startsWith(gitea.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve GHCR image name
        id: image
        shell: bash
        env:
          GHCR_NAMESPACE: ${{ vars.GHCR_NAMESPACE || secrets.GHCR_USERNAME }}
        run: |
          namespace="${GHCR_NAMESPACE,,}"
          if [[ ! "$namespace" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "Set GHCR_USERNAME secret or GHCR_NAMESPACE variable to a GitHub account or organization name."
            exit 1
          fi
          echo "name=ghcr.io/${namespace}/nomail-api" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable=${{ gitea.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: type=registry,ref=${{ steps.image.outputs.name }}:buildcache,mode=max
          provenance: mode=min
