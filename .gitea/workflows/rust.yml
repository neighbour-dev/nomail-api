name: Rust checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Checks and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --bins

  integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    # Explicit container execution gives the job and its services a shared Docker network.
    # Node is needed by actions/checkout; the Rust toolchain is installed below.
    container:
      image: node:22-bookworm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nomail-test-only
          POSTGRES_DB: nomail_test
        options: >-
          --health-cmd "pg_isready -U postgres -d nomail_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:nomail-test-only@postgres:5432/nomail_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends postgresql-client
      - name: Verify test database connection
        env:
          PGPASSWORD: nomail-test-only
          PGCONNECT_TIMEOUT: '5'
        run: psql --host=postgres --username=postgres --dbname=nomail_test --no-password --set=ON_ERROR_STOP=1 --command='SELECT 1'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.0'
      - name: Run PostgreSQL integration tests
        run: cargo test --locked --test api -- --ignored
