[package]
name = "nomail-app"
version.workspace = true
edition = "2024"
rust-version = "1.99"
license-file.workspace = true
description = "NoMail community application and shared HTTP contract"

[features]
openapi = ["dep:schemars", "nomail-core/openapi"]

[dependencies]
nomail-core = { path = "../nomail-core" }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
uuid = { version = "1", default-features = false, features = ["std", "serde"] }
bcrypt = { version = "0.17", default-features = false, features = ["alloc", "zeroize"] }
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
percent-encoding = "2"
schemars = { version = "1", optional = true, features = ["chrono04", "uuid1"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

[[example]]
name = "export-openapi"
path = "examples/export_openapi.rs"
required-features = ["openapi"]
