services:
  nomail-api:
    image: ghcr.io/neighbour-dev/nomail-api:latest
    container_name: nomail-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/nomail.db
    volumes:
      - nomail-data:/data
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  nomail-data:
