name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Run checks
    uses: ./.github/workflows/ci.yml

  release-info:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check tag matches workspace version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 <<'PY'
          import os
          import tomllib

          with open("Cargo.toml", "rb") as manifest:
              version = tomllib.load(manifest)["workspace"]["package"]["version"]
          expected = f"v{version}"
          if os.environ["TAG"] != expected:
              raise SystemExit(f"::error::Tag must match workspace version: expected {expected}")
          print(f"Release version: {version}")
          PY

      - name: Validate version and detect prerelease
        id: version
        env:
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Expected a version tag such as v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate changelog release notes
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release_notes.py "$TAG" "$RUNNER_TEMP/release-notes.md"

  build:
    name: Build image (${{ matrix.arch }})
    needs: [check, release-info]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  build-binaries:
    name: Build binaries (${{ matrix.arch }})
    needs: [check, release-info]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: release-binaries-${{ matrix.arch }}

      - name: Build release binaries
        run: cargo build --locked --release -p nomail-server --bins

      - name: Package release binaries
        env:
          TAG: ${{ github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/binaries" "$RUNNER_TEMP/release-assets"
          cp target/release/nomail-api target/release/reset-account target/release/gen-secret-key \
            .env.example LICENSE "$RUNNER_TEMP/binaries/"
          tar -czf "$RUNNER_TEMP/release-assets/nomail-api-${TAG}-linux-${ARCH}.tar.gz" \
            -C "$RUNNER_TEMP/binaries" \
            nomail-api reset-account gen-secret-key .env.example LICENSE

      - name: Upload release binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-assets/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform image
    needs: [build, release-info]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest,enable=${{ needs.release-info.outputs.prerelease == 'false' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.release-info.outputs.prerelease == 'false' }}

      - name: Merge and publish manifest
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          IMAGE_METADATA_JSON: ${{ steps.metadata.outputs.json }}
        shell: bash
        run: |
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$IMAGE_METADATA_JSON")
          sources=()
          for digest in "$RUNNER_TEMP"/digests/*; do
            sources+=("$IMAGE@sha256:$(basename "$digest")")
          done
          docker buildx imagetools create "${args[@]}" "${sources[@]}"

      - name: Inspect published image
        env:
          IMAGE_METADATA_JSON: ${{ steps.metadata.outputs.json }}
        run: docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$IMAGE_METADATA_JSON")"

  release:
    name: Create GitHub Release
    needs: [publish, build-binaries, release-info]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Extract changelog release notes
        env:
          TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release_notes.py "$TAG" "$RUNNER_TEMP/release-notes.md"

      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: ${{ runner.temp }}/release-assets
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Create release with changelog notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.release-info.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; updating assets without changing release notes."
          else
            args=(--verify-tag --notes-file "$RUNNER_TEMP/release-notes.md" --title "$TAG")
            if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP"/release-assets/* --clobber
