name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  openapi:
    name: Generate and verify OpenAPI
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: check-openapi

      # Always regenerate from this checkout, never reuse a local or cached JSON.
      - name: Generate OpenAPI
        run: cargo run --locked -p nomail-app --features openapi --example export-openapi -- docs/swagger.json

      - name: Verify OpenAPI contract
        run: cargo test --locked -p nomail-app --features openapi --lib

      - name: Upload verified OpenAPI
        uses: actions/upload-artifact@v7
        with:
          name: swagger
          path: docs/swagger.json
          if-no-files-found: error
          retention-days: 1

  check:
    name: Check (${{ matrix.arch }})
    needs: [openapi]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: check-${{ matrix.arch }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Test workflow and release scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      # Server tests include this file at compile time.
      - name: Download verified OpenAPI
        uses: actions/download-artifact@v8
        with:
          name: swagger
          path: docs

      # Use the workspace's default members; the Workers job tests its own runtime.
      - name: Run tests
        run: cargo test --locked

  workers:
    name: Workers (local D1/DO)
    needs: [openapi]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/nomail-workers
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust with WASM target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          key: check-workers-local

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: crates/nomail-workers/package-lock.json

      - name: Install Workers test dependencies
        run: npm ci

      - name: Install worker-build
        run: cargo install --locked --version 0.8.7 worker-build

      - name: Check Workers WASM
        run: cargo check --locked -p nomail-workers --target wasm32-unknown-unknown

      - name: Download verified OpenAPI
        uses: actions/download-artifact@v8
        with:
          name: swagger
          path: docs

      # Keep the cold Rust/WASM build outside the integration test's startup
      # timeout. Wrangler can reuse these artifacts when it runs the build again.
      - name: Build Worker bundle
        run: worker-build --release

      # npm test applies D1 migrations and starts Wrangler with --local and an
      # isolated --persist-to directory. No Cloudflare credentials are needed.
      - name: Test Workers with local D1 and Durable Objects
        run: npm test
