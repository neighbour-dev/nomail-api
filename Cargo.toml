[workspace]
members = ["crates/nomail-core", "crates/nomail-app", "crates/nomail-server", "crates/nomail-workers"]
default-members = ["crates/nomail-core", "crates/nomail-app", "crates/nomail-server"]
resolver = "3"

[workspace.package]
version = "0.4.0"
license-file = "LICENSE"

[profile.release]
lto = "thin"
# Keep WASM target_features for wasm-bindgen's externref transform.
strip = "debuginfo"

[profile.release.package.nomail-server]
strip = true
